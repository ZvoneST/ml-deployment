[project]
name = "ml-deployment"
version = "0.1.0"
description = "Serve, monitor and A/B test ML models with FastAPI"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient nags about httpx; harmless for tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py312"
